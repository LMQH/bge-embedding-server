[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bge-embedding"
version = "1.1.0"
description = "Local BGE-M3 dense embeddings on Apple Metal"
requires-python = ">=3.12,<3.13"
dependencies = ["mlx==0.32.4", "mlx-embeddings==0.1.0", "mlx-vlm==0.4.0", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bge_embedding*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m smoke"
markers = ["smoke: minimal startup and request checks", "real: requires local model weights and Apple Metal"]
